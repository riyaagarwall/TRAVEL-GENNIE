<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelGenie - Travel Planner</title>
    
    <!-- Google Font: Bricolage Grotesque (weights 400, 600, 800) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Top Header (Wordmark and Tagline) -->
    <header class="site-header">
        <div class="header-inner">
            <div class="logo-group">
                <span class="site-logo">TravelGenie</span>
                <span class="site-tagline">Day-by-day trip plans</span>
            </div>
        </div>
    </header>

    <!-- Main Two-Column Layout -->
    <main class="app-layout">
        
        <!-- Left Column: Trip Request Form -->
        <section class="form-column" aria-labelledby="form-heading">
            <div class="form-header">
                <h1 id="form-heading" class="form-title">Where to, and for how long?</h1>
                <p class="form-subtitle">Tell TravelGenie the basics and get a day-by-day plan you can tweak.</p>
            </div>

            <!-- User Preferences Form -->
            <form id="trip-form" class="trip-form" novalidate>
                
                <!-- Destination Input -->
                <div class="field-group">
                    <label for="destination">Destination</label>
                    <input 
                        type="text" 
                        id="destination" 
                        name="destination" 
                        placeholder="e.g. Tokyo, Japan" 
                        maxlength="200" 
                        required
                    >
                </div>

                <!-- Days Input -->
                <div class="field-group">
                    <label for="days">Number of Days (1-14)</label>
                    <input 
                        type="number" 
                        id="days" 
                        name="days" 
                        min="1" 
                        max="14" 
                        value="3" 
                        required
                    >
                </div>

                <!-- Budget & Pace in a 2-column sub-grid -->
                <div class="field-row">
                    <!-- Budget Selection -->
                    <div class="field-group">
                        <label for="budget">Budget Level</label>
                        <select id="budget" name="budget">
                            <option value="budget">Budget</option>
                            <option value="mid-range" selected>Mid-range</option>
                            <option value="luxury">Luxury</option>
                        </select>
                    </div>

                    <!-- Travel Pace Selection -->
                    <div class="field-group">
                        <label for="pace">Preferred Pace</label>
                        <select id="pace" name="pace">
                            <option value="relaxed">Relaxed</option>
                            <option value="balanced" selected>Balanced</option>
                            <option value="packed">Packed</option>
                        </select>
                    </div>
                </div>

                <!-- Interests Input -->
                <div class="field-group">
                    <label for="interests">Interests & Activities</label>
                    <input 
                        type="text" 
                        id="interests" 
                        name="interests" 
                        placeholder="e.g. street food, museums, architecture" 
                        maxlength="200"
                    >
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="submit-btn">
                    <span class="btn-text">Plan my trip</span>
                </button>

                <!-- Status & Error Alert Container -->
                <div id="status-message" class="status-message" aria-live="polite"></div>
            </form>
        </section>

        <!-- Right Column: Single Results Panel (shows empty, loading, or itinerary) -->
        <section class="itinerary-column" id="results-panel" aria-label="Generated Itinerary">
            
            <!-- State 1: Default Empty State (Route arc SVG & prompt) -->
            <div id="itinerary-placeholder" class="itinerary-placeholder">
                <div class="placeholder-content">
                    <!-- Clean inline SVG route path between two points -->
                    <svg class="placeholder-route-svg" width="130" height="42" viewBox="0 0 130 42" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="12" cy="30" r="4" fill="#0d9488" />
                        <circle cx="118" cy="12" r="4" fill="#d97706" />
                        <path d="M 12 30 Q 65 -8 118 12" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 4" fill="none" />
                    </svg>
                    <p class="placeholder-text">Pick a destination to see your route.</p>
                </div>
            </div>

            <!-- State 2: Loading State (Three skeleton ticket outlines that gently pulse) -->
            <div id="itinerary-loading" class="itinerary-loading" hidden aria-live="polite">
                <p class="loading-text">Planning your trip...</p>
                <div class="skeleton-tickets" aria-hidden="true">
                    <!-- Skeleton Day Ticket 1 -->
                    <div class="skeleton-ticket">
                        <div class="skeleton-header">
                            <div class="skeleton-stub"></div>
                            <div class="skeleton-line skeleton-title"></div>
                        </div>
                        <div class="skeleton-body">
                            <div class="skeleton-row">
                                <div class="skeleton-pill"></div>
                                <div class="skeleton-line skeleton-desc"></div>
                                <div class="skeleton-cost"></div>
                            </div>
                            <div class="skeleton-row">
                                <div class="skeleton-pill"></div>
                                <div class="skeleton-line skeleton-desc skeleton-short"></div>
                                <div class="skeleton-cost"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Skeleton Day Ticket 2 -->
                    <div class="skeleton-ticket">
                        <div class="skeleton-header">
                            <div class="skeleton-stub"></div>
                            <div class="skeleton-line skeleton-title"></div>
                        </div>
                        <div class="skeleton-body">
                            <div class="skeleton-row">
                                <div class="skeleton-pill"></div>
                                <div class="skeleton-line skeleton-desc"></div>
                                <div class="skeleton-cost"></div>
                            </div>
                            <div class="skeleton-row">
                                <div class="skeleton-pill"></div>
                                <div class="skeleton-line skeleton-desc skeleton-short"></div>
                                <div class="skeleton-cost"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Skeleton Day Ticket 3 -->
                    <div class="skeleton-ticket">
                        <div class="skeleton-header">
                            <div class="skeleton-stub"></div>
                            <div class="skeleton-line skeleton-title"></div>
                        </div>
                        <div class="skeleton-body">
                            <div class="skeleton-row">
                                <div class="skeleton-pill"></div>
                                <div class="skeleton-line skeleton-desc"></div>
                                <div class="skeleton-cost"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- State 3: Dynamic Itinerary Output Area (Populated on success) -->
            <div id="itinerary-results" class="itinerary-results" hidden></div>
        </section>
    </main>

    <!-- Client-side JavaScript -->
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
